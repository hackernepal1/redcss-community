<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REDCSS Admin</title><link rel="stylesheet" href="/styles.css"></head><body><header class="site-header"><a class="brand" href="/"><span class="brand-mark"><svg viewBox="0 0 64 72"><path d="M32 3 57 13v21c0 16-10 27-25 35C17 61 7 50 7 34V13L32 3Z"/><path d="M22 39 32 21l10 18M25 34h14M27 46h10"/></svg></span><span class="brand-copy"><b>RED<span>CSS</span></b><small>ADMIN CONSOLE</small></span></a><a href="/" class="back-top">← VIEW WEBSITE</a></header><main class="section-wrap section-pad"><div class="section-kicker">PRIVATE AREA / ADMIN</div><h2>Community<br><span>management.</span></h2><section id="loginPanel" class="contact-form" style="max-width:520px;margin-top:35px"><h3>Administrator login</h3><label>Username<input id="username" autocomplete="username" value="admin"></label><label>Password<input id="password" type="password" autocomplete="current-password"></label><button class="btn btn-red" id="loginBtn">Sign in ↗</button><p id="loginStatus" class="form-status"></p></section><section id="dashboard" hidden style="margin-top:35px"><div class="heading-row"><h2>Inbox & posts</h2><button class="btn btn-ghost" id="logoutBtn">Sign out</button></div><div class="contact-grid" style="grid-template-columns:1fr 1fr;gap:20px"><form id="postForm" class="contact-form"><h3>Create an article</h3><label>Title<input name="title" required maxlength="180"></label><label>Category<input name="category" maxlength="60" placeholder="Web Security"></label><label>Short summary<textarea name="excerpt" rows="2" maxlength="400"></textarea></label><label>Article content<textarea name="content" rows="6" required maxlength="5000"></textarea></label><button class="btn btn-red">Publish article ↗</button><p id="postStatus" class="form-status"></p></form><div class="contact-form"><h3>Contact messages</h3><div id="messagesList" style="display:grid;gap:14px"></div></div></div><div class="contact-form" style="margin-top:20px"><h3>Published articles</h3><div id="postsList" style="display:grid;gap:12px"></div></div></section></main><script src="/admin.js" defer></script></body></html>
